<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>National Engineering Robotics Contest 2026 — Heat Draws</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='screen.css') }}" />
</head>
<body>
  <header>
    <h1>National Engineering Robotics Contest 2026</h1>
    <p>Heat Draws</p>
  </header>

  <!-- Pre-reveal: either the DRAW button or, if a draw exists, the choice menu -->
  <section id="stage" class="stage"></section>

  <!-- Reveal: one category at a time, with Prev/Next -->
  <main id="result" class="result hidden">
    <div class="carousel-nav">
      <button id="prevBtn" class="nav-btn">‹ Previous</button>
      <span id="catProgress" class="progress"></span>
      <button id="nextBtn" class="nav-btn">Next ›</button>
    </div>
    <div id="catHolder"></div>
    <button id="menuBtn" class="menu-btn">≡ Menu</button>
  </main>

  <footer>
    <span id="seedInfo"></span>
  </footer>

  <script src="{{ url_for('static', filename='screen.js') }}"></script>
</body>
</html>
