<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NERC26</title>
  <style>
    :root { --fg: #1a1a1a; --muted: #666; --accent: #0b5fff; --line: #e5e5e5; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
      color: var(--fg); margin: 0; line-height: 1.5;
    }
    header {
      padding: 2.2rem 1.5rem; text-align: center;
      border-bottom: 1px solid var(--line);
    }
    .brandbar { display: flex; align-items: center; justify-content: center;
      gap: 1.5rem; margin-bottom: 1rem; }
    .brandbar img { height: 80px; width: auto; }
    .brandbar h1 { margin: 0; font-size: 2.5rem; }
    header p { margin: 0 0 .75rem; color: var(--muted); }
    @media (max-width: 600px) {
      .brandbar { gap: .8rem; }
      .brandbar img { height: 46px; }
      .brandbar h1 { font-size: 1.5rem; }
    }
    .cta {
      display: inline-block; text-decoration: none; font-weight: 700;
      background: var(--accent); color: #fff; padding: .55rem 1.2rem;
      border-radius: 999px; font-size: .95rem;
    }
    .cta:hover { opacity: .9; }
    main { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; }
    .card { border: 1px solid var(--line); border-radius: 10px; padding: 1.25rem; }
    .card .num { font-size: 2rem; font-weight: 700; color: var(--accent); }
    .card .label { color: var(--muted); font-size: .9rem; }
    h2 { margin-top: 2.5rem; border-bottom: 1px solid var(--line); padding-bottom: .4rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .5rem .25rem; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; font-size: .85rem; }
    .bar { background: var(--accent); height: 10px; border-radius: 5px; }

    /* Teams by city -> institution breakdown */
    .city { margin-bottom: 1.6rem; }
    .city-head { display: flex; align-items: baseline; gap: .6rem;
      border-bottom: 2px solid var(--accent); padding-bottom: .35rem; margin-bottom: .3rem; }
    .city-head .name { font-size: 1.15rem; font-weight: 700; }
    .city-head .count { margin-left: auto; background: var(--accent); color: #fff;
      border-radius: 999px; padding: .1rem .65rem; font-size: .8rem; font-weight: 700;
      font-variant-numeric: tabular-nums; }
    ol.insts { margin: .25rem 0 0; padding: 0 0 0 1.9rem; }
    ol.insts li { display: flex; align-items: baseline; gap: 1rem; padding: .28rem 0;
      border-bottom: 1px solid var(--line); }
    ol.insts li::marker { color: var(--muted); font-size: .85rem; }
    ol.insts .iname { flex: 1; min-width: 0; }
    ol.insts .icount { flex: 0 0 auto; color: var(--muted); font-weight: 700;
      font-variant-numeric: tabular-nums; }
    ol.insts li.private .iname { color: var(--muted); font-style: italic; }
  </style>
</head>
<body>
  <header>
    <div class="brandbar">
      <img src="nust.png" alt="NUST" />
      <h1>NERC26</h1>
      <img src="ceme.png" alt="CEME" />
    </div>
    <p>National Engineering Robotics Contest 2026 — <a href="https://www.dmtsnust.com/" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;text-decoration:none">Official Website ↗</a></p>
    <p><a class="cta" href="draws.html">View the Heat Draws →</a>
       <a class="cta" href="bracket.html">View the Brackets →</a>
       <a class="cta" href="schedule.html">Match Schedule →</a></p>
  </header>
  <main>
    <div class="cards" id="cards"></div>
    <h2>Teams by event</h2>
    <table id="events"><tbody></tbody></table>
    <h2>Teams by city</h2>
    <div id="cities"></div>
  </main>

  <script>
    async function load() {
      const d = await fetch('data.json', { cache: 'no-store' }).then(r => r.json());

      const cards = [
        ['Teams', d.total_teams],
        ['Participants', d.total_participants],
        ['Events', Object.keys(d.by_event).length],
      ];
      document.getElementById('cards').innerHTML = cards.map(
        ([l, n]) => `<div class="card"><div class="num">${n}</div><div class="label">${l}</div></div>`
      ).join('');

      function fill(id, obj, max) {
        const top = Object.entries(obj).slice(0, max || 999);
        const peak = Math.max(...top.map(([, v]) => v));
        document.querySelector(`#${id} tbody`).innerHTML =
          `<tr><th>Name</th><th>Teams</th><th></th></tr>` +
          top.map(([k, v]) =>
            `<tr><td>${k || '(blank)'}</td><td>${v}</td>
             <td><div class="bar" style="width:${(v / peak) * 100}%"></div></td></tr>`
          ).join('');
      }
      fill('events', d.by_event);

      document.getElementById('cities').innerHTML =
        Object.entries(d.by_city_detail || {}).map(([city, info]) => `
          <div class="city">
            <div class="city-head"><span class="name">${city || '(blank)'}</span>
              <span class="count">${info.total}</span></div>
            <ol class="insts">
              ${info.institutions.map(i =>
                `<li${i.name === 'Private Teams' ? ' class="private"' : ''}>
                   <span class="iname">${i.name}</span>
                   <span class="icount">${i.count}</span></li>`
              ).join('')}
            </ol>
          </div>`
        ).join('');
    }
    load();
  </script>
</body>
</html>
