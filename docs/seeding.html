<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NERC26 — Seeding</title>
  <style>
    :root {
      --bg:#0a0e1a; --panel:#121a30; --line:#243152; --fg:#f2f5ff;
      --muted:#8da2c9; --accent:#2f7bff; --accent2:#00d4a0;
    }
    *{box-sizing:border-box}
    body{
      margin:0; background:radial-gradient(1200px 700px at 50% -10%,#16224a 0%,var(--bg) 60%);
      color:var(--fg); font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;
      min-height:100vh;
    }
    header{text-align:center; padding:1.6rem 1rem .4rem}
    header h1{
      margin:0; font-size:2.8rem; letter-spacing:.15em; font-weight:800;
      background:linear-gradient(90deg,var(--accent),var(--accent2));
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    header p{margin:.2rem 0 0; color:var(--muted); letter-spacing:.25em;
      text-transform:uppercase; font-size:.85rem}
    .grid{
      display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
      gap:1rem; padding:1rem 1.5rem 2rem; align-content:start; max-width:1400px; margin:0 auto;
    }
    .cat{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:1rem 1.2rem}
    .cat h2{margin:0; font-size:1.4rem}
    .cat .sched{color:var(--muted); font-size:.85rem; margin:.15rem 0 .8rem}
    .cat ol{list-style:none; margin:0; padding:0; columns:2; column-gap:1.4rem}
    .cat li{display:flex; gap:.6rem; padding:.22rem 0;
      border-bottom:1px dashed rgba(255,255,255,.06); break-inside:avoid}
    .cat li .num{flex:0 0 1.9rem; text-align:right; font-variant-numeric:tabular-nums;
      font-weight:700; color:var(--accent2)}
    .cat li .name{font-weight:600}
    .cat li .inst{color:var(--muted); font-size:.8rem; margin-left:auto; text-align:right}
    footer{text-align:center; color:var(--muted); font-size:.85rem; padding:1rem; border-top:1px solid var(--line)}
    .empty{text-align:center; color:var(--muted); padding:4rem 1rem}
  </style>
</head>
<body>
  <header>
    <h1>NERC26</h1>
    <p>Solo-Run Seeding</p>
  </header>
  <main class="grid" id="grid"></main>
  <footer id="foot"></footer>

  <script>
    function ordered(categories){
      return Object.entries(categories).sort((a,b)=>{
        const sa=a[1].schedule||{}, sb=b[1].schedule||{};
        return (sa.day||"").localeCompare(sb.day||"") ||
               (sa.time||"").localeCompare(sb.time||"") ||
               a[0].localeCompare(b[0]);
      });
    }
    async function load(){
      let data;
      try { data = await fetch("draw.json").then(r=>r.json()); }
      catch(e){ data = null; }
      const grid = document.getElementById("grid");
      if(!data || !data.categories){
        grid.innerHTML = '<div class="empty">The draw has not been published yet.</div>';
        return;
      }
      grid.innerHTML = ordered(data.categories).map(([name,info])=>{
        const s = info.schedule;
        const sched = s ? `${s.day} · ${s.time} · ${s.venue}` : "Schedule TBD";
        const rows = info.teams.map(t=>`<li>
          <span class="num">${t.seed}</span>
          <span class="name">${t.team_name||"—"}</span>
          <span class="inst">${t.institution||""}</span></li>`).join("");
        return `<section class="cat">
          <h2>${name} <small style="color:var(--muted);font-size:.9rem">(${info.team_count})</small></h2>
          <div class="sched">${sched}</div>
          <ol>${rows}</ol></section>`;
      }).join("");
      document.getElementById("foot").textContent =
        `Seed ${data.rng_seed} · drawn ${data.drawn_at}`;
    }
    load();
  </script>
</body>
</html>
